spring.application.name=calendar-copilot

# Database (defaults match docker-compose.yml; overridden by env vars in AWS)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/calendar_copilot}
spring.datasource.username=${DB_USERNAME:copilot}
spring.datasource.password=${DB_PASSWORD:copilot}
spring.datasource.hikari.maximum-pool-size=5

# Flyway owns the schema; Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Blocking calls (DB, Gemini) run on virtual threads
spring.threads.virtual.enabled=true

# Health endpoint at /api/health so it is reachable through CloudFront's /api/* behavior
management.endpoints.web.base-path=/api
management.endpoints.web.exposure.include=health
management.endpoints.web.path-mapping.health=health

# Return RFC 7807 problem details for framework errors
spring.mvc.problemdetails.enabled=true

app.workspace.ttl-days=7
app.workspace.max-tasks=500
app.workspace.max-events=300
app.task.max-depth=3

# Shared secret CloudFront sends in X-Origin-Verify (empty = check disabled, for local dev)
app.origin-verify-secret=${ORIGIN_VERIFY_SECRET:}

# ---- AI planner (Gemini) ----
# The key comes from the environment (SSM in AWS, .env locally). Empty disables AI endpoints.
app.ai.api-key=${GEMINI_API_KEY:}
app.ai.model=${GEMINI_MODEL:gemini-3.8-flash}
# Lowest thinking level the default model supports: planning does not need deep reasoning.
app.ai.thinking-level=${GEMINI_THINKING_LEVEL:low}
app.ai.base-url=https://generativelanguage.googleapis.com/v1beta
app.ai.timeout=50s
app.ai.max-output-tokens=8192
app.ai.max-files=6
app.ai.max-file-size=5MB
app.ai.max-pdf-pages=30
app.ai.max-document-chars=60000
app.ai.max-context-chars=4000
app.ai.max-concurrent=4
app.ai.limits.per-workspace-per-hour=5
app.ai.limits.per-ip-per-hour=20
app.ai.limits.global-per-day=200

# Uploads are held in memory only for the request and never written to disk or the database.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=16MB
spring.servlet.multipart.file-size-threshold=16MB
