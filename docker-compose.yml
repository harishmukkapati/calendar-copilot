# Local development database. Matches the RDS engine version used in AWS.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: calendar_copilot
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot -d calendar_copilot"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
